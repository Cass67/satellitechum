---
- name: Deploy satellite-chum
  hosts: rocky
  become: false
  vars:
    app_dir: /home/cass/satellite-chum
    archive: /tmp/satellite-chum-deploy.tar.gz
    trusted_hosts: "{{ inventory_hostname }}"

  tasks:
    # The archive is built from the working tree, so refuse to ship anything
    # that is not exactly origin/main and passing tests.
    - name: Refuse to deploy uncommitted, unpushed or failing code
      ansible.builtin.shell:
        chdir: "{{ playbook_dir }}/.."
        cmd: >
          git diff --quiet HEAD &&
          test -z "$(git status --porcelain)" &&
          git fetch -q origin main &&
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" &&
          go test ./...
      delegate_to: localhost
      changed_when: false

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Check .env exists
      ansible.builtin.stat:
        path: "{{ app_dir }}/.env"
      register: env_file

    - name: Generate SECRET_KEY for new .env
      ansible.builtin.command:
        cmd: python3 -c "import secrets; print(secrets.token_hex(32))"
      register: generated_secret
      changed_when: false
      when: not env_file.stat.exists

    - name: Bootstrap .env on first deploy
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          SATELLITECHUM_ENV=production
          SECRET_KEY={{ generated_secret.stdout }}
          SESSION_COOKIE_SECURE=true
          TRUSTED_HOSTS={{ trusted_hosts }}
          TUNNEL_TOKEN=
          # Cloudflare Turnstile keys — add your real keys here
          TURNSTILE_SITE_KEY=
          TURNSTILE_SECRET_KEY=
      when: not env_file.stat.exists

    - name: Create deployment archive
      ansible.builtin.shell:
        cmd: >
          tar -czf {{ archive }}
          --exclude='.git'
          --exclude='__pycache__'
          --exclude='*.pyc'
          --exclude='.env'
          --exclude='node_modules'
          --exclude='.playwright-cli'
          --exclude='output'
          --exclude='tests'
          --exclude='satellitechum'
          --exclude='*.md'
          -C {{ playbook_dir }}/../ .
      delegate_to: localhost
      changed_when: false

    - name: Upload and extract archive
      ansible.builtin.unarchive:
        src: "{{ archive }}"
        dest: "{{ app_dir }}"
        remote_src: false
      notify: Restart stack

    - name: Remove local archive
      ansible.builtin.file:
        path: "{{ archive }}"
        state: absent
      delegate_to: localhost
      changed_when: false

  handlers:
    - name: Restart stack
      ansible.builtin.shell:
        cmd: podman compose build --no-cache && podman compose up -d --force-recreate
        chdir: "{{ app_dir }}"

  post_tasks:
    - name: Install satellite-chum-stack user systemd service
      ansible.builtin.copy:
        src: satellite-chum-stack.service
        dest: "{{ app_dir }}/../.config/systemd/user/satellite-chum-stack.service"
        mode: "0644"

    - name: Reload user systemd
      ansible.builtin.shell: systemctl --user daemon-reload
      changed_when: true

    - name: Enable and start satellite-chum-stack user service
      ansible.builtin.shell: systemctl --user enable --now satellite-chum-stack
      changed_when: true

    - name: Wait for the app to answer
      ansible.builtin.command: >-
        podman exec satellite-chum_app_1 /bin/busybox
        wget -qO- http://localhost:6666/healthz
      changed_when: false
      until: health.stdout | trim == "ok"
      retries: 10
      delay: 3
      register: health
