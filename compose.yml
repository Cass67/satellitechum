services:
  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - skynet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SATELLITECHUM_ENV: production
      GUNICORN_BIND: 0.0.0.0:6666
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - skynet
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 6666), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - skynet
    depends_on:
      app:
        condition: service_healthy

networks:
  skynet:
    driver: bridge
